name: Setup
description: Node from .tool-versions, pnpm from packageManager, cached store, frozen install.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .tool-versions
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
