name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter web smoke

  # Production on `main`, a preview per PR branch. Fork PRs get no secrets, so no preview.
  # PROTOTYPE branch: deploy the preview without waiting for `check` (throwaway code, no tests).
  deploy-web:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter web build
        env:
          # The production Worker's origin, a repository variable. Unset, the app never syncs.
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: pages deploy --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # No per-PR API preview: a Worker preview runs with the production D1 binding.
  deploy-api:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Before the deploy, so the new Worker never runs against an older schema.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          command: d1 migrations apply ecureuil --remote
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          command: deploy
      - name: Smoke /health
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors "$API_URL/health" | grep '"ok":true'
        env:
          API_URL: ${{ steps.deploy.outputs.deployment-url }}
